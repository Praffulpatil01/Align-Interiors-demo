<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="apBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F1E9DD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#apBg)"/>
  
  <!-- Architectural line drafting: 2BHK/3BHK Living Room -->
  <g stroke="#2A2420" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <rect x="100" y="80" width="600" height="440" rx="4"/>
    <!-- Floor plan sketch line -->
    <line x1="100" y1="360" x2="700" y2="360"/>
    <line x1="280" y1="360" x2="280" y2="520"/>
    <line x1="500" y1="360" x2="500" y2="520"/>
    <!-- Living room furniture -->
    <rect x="320" y="400" width="140" height="60" rx="6" stroke="#B4573A" stroke-opacity="0.4"/>
    <rect x="350" y="475" width="80" height="30" rx="4" stroke="#2A2420" stroke-opacity="0.3"/>
    <!-- TV console & feature wall elevation -->
    <rect x="250" y="140" width="300" height="170" rx="2" stroke="#2A2420" stroke-opacity="0.3"/>
    <!-- Vertical flutes -->
    <line x1="270" y1="140" x2="270" y2="310" stroke-opacity="0.15"/>
    <line x1="285" y1="140" x2="285" y2="310" stroke-opacity="0.15"/>
    <line x1="300" y1="140" x2="300" y2="310" stroke-opacity="0.15"/>
    <line x1="315" y1="140" x2="315" y2="310" stroke-opacity="0.15"/>
    <!-- Floating console -->
    <rect x="230" y="270" width="340" height="25" fill="#FAF6F0" stroke="#B4573A" stroke-opacity="0.6"/>
  </g>

  <!-- Tag badge -->
  <rect x="260" y="250" width="280" height="74" rx="8" fill="#FAF6F0" fill-opacity="0.95" stroke="#E3DAD0" stroke-width="1"/>
  <text x="400" y="280" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="600" fill="#2A2420" text-anchor="middle">Apartment Interior (2BHK / 3BHK)</text>
  <text x="400" y="304" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#B4573A" text-anchor="middle" letter-spacing="1">ALIGN ARCHITECTURE &amp; INTERIORS</text>
</svg>
