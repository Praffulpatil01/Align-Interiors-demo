<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgKitchen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F1E9DD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgKitchen)"/>
  
  <g stroke="#2A2420" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <!-- Modular Kitchen Cabinets elevation -->
    <!-- Overhead cabinets -->
    <rect x="150" y="120" width="500" height="120" stroke="#B4573A" stroke-opacity="0.4"/>
    <line x1="275" y1="120" x2="275" y2="240"/>
    <line x1="400" y1="120" x2="400" y2="240"/>
    <line x1="525" y1="120" x2="525" y2="240"/>
    <!-- Backsplash with herringbone tile sketch -->
    <rect x="150" y="240" width="500" height="110" stroke-opacity="0.15"/>
    <line x1="150" y1="295" x2="650" y2="295" stroke-dasharray="2,2"/>
    <!-- Base counter & drawers -->
    <rect x="150" y="350" width="500" height="150" stroke="#2A2420" stroke-opacity="0.4"/>
    <line x1="275" y1="350" x2="275" y2="500"/>
    <line x1="400" y1="350" x2="400" y2="500"/>
    <line x1="525" y1="350" x2="525" y2="500"/>
    <line x1="150" y1="410" x2="650" y2="410"/>
  </g>

  <rect x="250" y="250" width="300" height="74" rx="8" fill="#FAF6F0" fill-opacity="0.95" stroke="#E3DAD0" stroke-width="1"/>
  <text x="400" y="280" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="600" fill="#2A2420" text-anchor="middle">Modular Kitchen Planning</text>
  <text x="400" y="304" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#B4573A" text-anchor="middle" letter-spacing="1">ALIGN ARCHITECTURE &amp; INTERIORS</text>
</svg>
