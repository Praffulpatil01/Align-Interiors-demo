<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgFurn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F1E9DD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgFurn)"/>
  
  <g stroke="#2A2420" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <!-- Custom credenza and joinery detail -->
    <rect x="200" y="240" width="400" height="180" rx="4" stroke="#B4573A" stroke-opacity="0.5"/>
    <line x1="333" y1="240" x2="333" y2="420" stroke="#2A2420" stroke-opacity="0.3"/>
    <line x1="466" y1="240" x2="466" y2="420" stroke="#2A2420" stroke-opacity="0.3"/>
    <!-- Handles -->
    <line x1="320" y1="310" x2="320" y2="350" stroke="#B4573A" stroke-width="2"/>
    <line x1="346" y1="310" x2="346" y2="350" stroke="#B4573A" stroke-width="2"/>
    <line x1="453" y1="310" x2="453" y2="350" stroke="#B4573A" stroke-width="2"/>
    <!-- Legs -->
    <line x1="230" y1="420" x2="215" y2="480" stroke-width="2"/>
    <line x1="570" y1="420" x2="585" y2="480" stroke-width="2"/>
  </g>

  <rect x="270" y="250" width="260" height="74" rx="8" fill="#FAF6F0" fill-opacity="0.95" stroke="#E3DAD0" stroke-width="1"/>
  <text x="400" y="280" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="600" fill="#2A2420" text-anchor="middle">Custom Furniture</text>
  <text x="400" y="304" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#B4573A" text-anchor="middle" letter-spacing="1">ALIGN ARCHITECTURE &amp; INTERIORS</text>
</svg>
