  <circle cx="300" cy="270" r="110" fill="#FAF6F0" stroke="#2A2420" stroke-width="1.5"/>
  <circle cx="300" cy="270" r="98" fill="none" stroke="#B4573A" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="300" y="285" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="600" fill="#2A2420" text-anchor="middle">RD</text>
  <text x="300" y="325" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#B4573A" text-anchor="middle" letter-spacing="3">STUDIO PRINCIPAL</text>

