      <stop offset="0%" stop-color="#F1E9DD"/>
      <stop offset="50%" stop-color="#EAE0D2"/>
      <stop offset="100%" stop-color="#DFD2C0"/>
    </linearGradient>
    <pattern id="diagonalLines" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="20" y2="0" stroke="#2A2420" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="600" height="700" fill="url(#rakeshBg)"/>
  <rect width="600" height="700" fill="url(#diagonalLines)"/>

  <!-- Border detail -->
