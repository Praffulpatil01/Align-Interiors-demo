<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgBed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F1E9DD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgBed)"/>
  
  <g stroke="#2A2420" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <!-- Master Bedroom elevation: Headboard & bedside pendants -->
    <rect x="220" y="150" width="360" height="320" rx="4" stroke="#B4573A" stroke-opacity="0.3"/>
    <!-- Upholstered flutes -->
    <line x1="280" y1="150" x2="280" y2="340" stroke-opacity="0.15"/>
    <line x1="340" y1="150" x2="340" y2="340" stroke-opacity="0.15"/>
    <line x1="400" y1="150" x2="400" y2="340" stroke-opacity="0.15"/>
    <line x1="460" y1="150" x2="460" y2="340" stroke-opacity="0.15"/>
    <line x1="520" y1="150" x2="520" y2="340" stroke-opacity="0.15"/>
    <!-- Bed frame -->
    <rect x="250" y="340" width="300" height="130" rx="6" stroke="#2A2420" stroke-opacity="0.4"/>
    <!-- Pillows -->
    <rect x="270" y="315" width="110" height="35" rx="4" stroke="#2A2420" stroke-opacity="0.3"/>
    <rect x="420" y="315" width="110" height="35" rx="4" stroke="#2A2420" stroke-opacity="0.3"/>
    <!-- Pendants -->
    <line x1="180" y1="90" x2="180" y2="280" stroke="#B4573A" stroke-opacity="0.5"/>
    <circle cx="180" cy="295" r="12" stroke="#B4573A" stroke-opacity="0.5"/>
    <line x1="620" y1="90" x2="620" y2="280" stroke="#B4573A" stroke-opacity="0.5"/>
    <circle cx="620" cy="295" r="12" stroke="#B4573A" stroke-opacity="0.5"/>
  </g>

  <rect x="260" y="250" width="280" height="74" rx="8" fill="#FAF6F0" fill-opacity="0.95" stroke="#E3DAD0" stroke-width="1"/>
  <text x="400" y="280" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="600" fill="#2A2420" text-anchor="middle">Master Bedroom Retreat</text>
  <text x="400" y="304" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#B4573A" text-anchor="middle" letter-spacing="1">ALIGN ARCHITECTURE &amp; INTERIORS</text>
</svg>
