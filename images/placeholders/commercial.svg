<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgComm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#F1E9DD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgComm)"/>
  
  <g stroke="#2A2420" stroke-width="1.2" stroke-opacity="0.25" fill="none">
    <!-- Office glass cabins and conference table perspective -->
    <rect x="120" y="100" width="560" height="400" rx="4"/>
    <line x1="280" y1="100" x2="280" y2="500" stroke="#B4573A" stroke-opacity="0.4"/>
    <line x1="520" y1="100" x2="520" y2="500" stroke="#B4573A" stroke-opacity="0.4"/>
    <!-- Glass mullions -->
    <line x1="120" y1="260" x2="680" y2="260" stroke-dasharray="4,4"/>
    <line x1="120" y1="380" x2="680" y2="380" stroke-dasharray="4,4"/>
    <!-- Conference desk -->
    <ellipse cx="400" cy="420" rx="140" ry="35" stroke="#2A2420" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="330" cy="400" r="10" stroke="#B4573A" stroke-opacity="0.5"/>
    <circle cx="470" cy="400" r="10" stroke="#B4573A" stroke-opacity="0.5"/>
    <circle cx="400" cy="445" r="10" stroke="#B4573A" stroke-opacity="0.5"/>
  </g>

  <rect x="240" y="250" width="320" height="74" rx="8" fill="#FAF6F0" fill-opacity="0.95" stroke="#E3DAD0" stroke-width="1"/>
  <text x="400" y="280" font-family="'Playfair Display', Georgia, serif" font-size="16" font-weight="600" fill="#2A2420" text-anchor="middle">Offices &amp; Commercial Spaces</text>
  <text x="400" y="304" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#B4573A" text-anchor="middle" letter-spacing="1">ALIGN ARCHITECTURE &amp; INTERIORS</text>
</svg>
